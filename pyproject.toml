[project]
name = "black-holes-shadows-one-shot-effort-medium-low"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "tqdm>=4.70.1",
]

[project.scripts]
bh-shadow = "bh_shadows.runner.run_shadow:main"
bh-matrix = "bh_shadows.core.matrix:main"

[project.optional-dependencies]
gpu = [
    "mlx>=0.32 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bh_shadows"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Single-letter names (l, I) mirror the physics/numerics convention (l = derivative
# axis selector, I = bilinear-interpolation weight) from the legacy implementation.
"src/bh_shadows/core/weyl_core.py" = ["E741"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
