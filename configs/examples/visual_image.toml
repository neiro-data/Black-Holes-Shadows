# Image sky: an equirectangular picture is mapped onto the sky and lensed by the hole.
# Schwarzschild, no disk; reuses the cached MD=0 matrix. `image` is resolved relative to THIS file.
# milky_way.jpg (1024 x 1024) is a star field; it is not 2:1, so it is stretched in longitude.
# Run:  uv run bh-shadow configs/examples/visual_image.toml --n 48
# Weyl traces phi, so left/right on the sky comes from the traced ray (see SCHEMA.md).

name = "visual_image"

[spacetime]
M  = 1.0
a  = 0.0
MD = 0.0
b  = 6.0

[observer]
distance = 15.0

[grid]
n = 160


[plot]
background = "image"
image = "milky_way.jpg"
