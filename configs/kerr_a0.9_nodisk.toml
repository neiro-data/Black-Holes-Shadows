# Example: Kerr black hole, spin a = 0.9, no disk, equatorial observer (theta0 = 90 deg).
# Run:     uv run python run_shadow.py configs/kerr_a0.9_nodisk.toml --n 64
# GPU:     add `--device gpu` (Apple Silicon, `uv sync --extra gpu`); or set it here:
#          [tracer]
#          device = "gpu"   # auto|cpu|gpu; auto = cpu for now; GPU is float32, Kerr only
# Output:  runs/<timestamp>_<name>/ (status/coord1/coord2/phi txt, image.png, run.json)
name = "kerr_a0.9_nodisk"

[spacetime]
M  = 1.0
a  = 0.9
MD = 0.0

[observer]
distance = 15.0
theta0   = 90.0

[grid]
n = 160

[plot]
palette = "grey_black_white"
