# Example: plain Schwarzschild black hole (MD = 0, no disk), Weyl coordinates.
# Run:     uv run bh-shadow configs/schwarzschild_nodisk.toml --n 64
# Device:  CPU (numba) by default; `--device gpu` runs the float32 Metal kernel on Apple Silicon
#          (needs `uv sync --extra gpu`; falls back to CPU, with a warning, if unavailable).
# Output:  runs/<timestamp>_<name>/ (outputs.npz, image.png, run.json)
name = "schwarzschild_nodisk"

[spacetime]
M  = 1.0
a  = 0.0
MD = 0.0
b  = 6.0

[observer]
distance = 15.0

[grid]
n = 160

[plot]
palette = "grey_black_white"
background = "palette"
grid = false
