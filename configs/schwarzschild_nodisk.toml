# Example: plain Schwarzschild black hole (MD = 0, no disk), Weyl coordinates.
# Run:     uv run python run_shadow.py configs/schwarzschild_nodisk.toml --n 64
# Device:  CPU only (numba); the GPU backend covers Kerr, so `--device gpu` falls back to CPU here.
# Output:  runs/<timestamp>_<name>/ (status/coord1/coord2 txt, image.png, run.json)
name = "schwarzschild_nodisk"

[spacetime]
M  = 1.0
a  = 0.0
MD = 0.0
b  = 6.0

[observer]
distance = 15.0

[grid]
n = 160

[plot]
palette = "grey_black_white"
background = "palette"
grid = false
