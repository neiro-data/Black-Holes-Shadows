# Example: Kerr black hole, spin a = 0.9, no disk, with the analytic shadow edge overlay.
# Run:     uv run bh-shadow configs/kerr_a0.9_shadow_edge.toml --n 512
# GPU:     add `--device gpu` (Apple Silicon, `uv sync --extra gpu`)
# Output:  runs/<timestamp>_<name>/ (outputs.npz, image.png, run.json)
name = "kerr_a0.9_shadow_edge"

[spacetime]
M  = 1.0
a  = 0.9
MD = 0.0

[observer]
distance = 15.0
theta0   = 90.0

[grid]
n = 320

[plot]
background = "black_hole"
shadow_edge = true
