# Example: Schwarzschild black hole inside a thin Morgan-Morgan disk (MD = disk mass, b = disk
# radius parameter), Weyl coordinates. Builds the lambda lookup matrix on first run.
# Run:     uv run python run_shadow.py configs/schwarzschild_disk.toml --n 64
# Device:  CPU only (numba); the GPU backend covers Kerr, so `--device gpu` falls back to CPU here.
# Output:  runs/<timestamp>_<name>/ (status/coord1/coord2 txt, image.png, run.json)
name = "schwarzschild_disk_MD0.1_b6"

[spacetime]
M  = 1.0
a  = 0.0
MD = 0.1
b  = 6.0

[observer]
distance = 15.0

[grid]
n = 160

[matrix]
n_grid = 1200
source = "auto"

[plot]
palette = "grey_black_white"
background = "palette"
grid = false
